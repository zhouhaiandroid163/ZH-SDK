plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zjw.sdkdemo'
    compileSdk 36

    defaultConfig {
        applicationId "com.zjw.sdkdemo"
        minSdkVersion 21
        targetSdkVersion 36
        multiDexEnabled true
        versionCode 243
        versionName "2.4.3.0817"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    viewBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['assets', '**.proto']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

// apk打包名称（AGP 9 移除 applicationVariants，改用 androidComponents）
def apkVersionName = android.defaultConfig.versionName ?: "1.0.0"
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("DEMO_" + new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC")) + "_V" + apkVersionName + ".apk")
        }
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'/*, '*.aar'*/], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3'

    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // 显式指定 recyclerview 版本（AGP 9 后 material 仅传递 1.1.0，缺少 bindingAdapterPosition/absoluteAdapterPosition）
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.activity:activity-ktx:1.8.1'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation "androidx.lifecycle:lifecycle-livedata:2.5.0"
    //工具
    implementation 'com.blankj:utilcodex:1.31.0'
    //glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'

    //-------------------------ZH SDK---------------------------
    //gson
    implementation 'com.google.code.gson:gson:2.13.1'
    //protobuf
    implementation 'com.google.protobuf:protobuf-java:4.34.1'
    //sifli aar
    implementation files('libs/SifliDFU-release.aar')
    implementation files('libs/serialTransport-release.aar')
    implementation files('libs/watchfacelibrary-release.aar')
    //SDK
    implementation files('libs/ZH_SDK_20260818_V2.4.3.aar')
    //----------------------------------------------------------

    implementation project(':imagepick')
    implementation project(path: ':libopus')
//    implementation project(path: ':ZhAppBle')
    //图形
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    //颜色选择
    implementation "com.github.skydoves:colorpickerview:2.2.4"
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'com.github.getActivity:XXPermissions:13.2'

    implementation 'com.squareup.okhttp3:okhttp:4.9.1'

    //二维码扫描
    implementation 'com.huawei.hms:scanplus:2.12.0.301'

    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.2")




}
